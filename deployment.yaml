# Define the Kubernetes API version used for Deployments
apiVersion: apps/v1
# Specify that this resource is a Deployment (responsible for managing replica Pods)
kind: Deployment
# Metadata configuration for this deployment
metadata:
  # The name of our deployment resource in Kubernetes
  name: simple-app-deployment
  # Key-value labels used to group and identify this resource
  labels:
    app: simple-app
# Specification of the desired state of the deployment
spec:
  # The number of identical container instances (Pods) we want running
  replicas: 2
  # Define how the deployment finds the pods it manages (matching the labels)
  selector:
    matchLabels:
      app: simple-app
  # Template used to create the Pods
  template:
    # Metadata for the Pods generated by this deployment
    metadata:
      # Labels assigned to the generated Pods (must match the selector above)
      labels:
        app: simple-app
    # Specification of the containers that run inside the Pods
    spec:
      containers:
      # A list of containers to start in the Pod (here we only have one container)
      - name: simple-app
        # The container image to run (the tag 'latest' refers to our local build)
        image: simple-app:latest
        # Instruct Kubernetes not to download the image from a remote registry
        # because the image exists only in our local/Minikube docker cache.
        imagePullPolicy: Never
        # The port inside the container that our web app listens on (Flask default is 5000)
        ports:
        - containerPort: 5000
        # Environment variables injected into the running container
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: app-secret    # The name of the Kubernetes secret vault
              key: secret-key     # The specific key inside that vault
---
# Define the Kubernetes API version used for Services
apiVersion: v1
# Specify that this resource is a Service (responsible for routing traffic to Pods)
kind: Service
# Metadata configuration for this service
metadata:
  # The name of our service resource in Kubernetes
  name: simple-app-service
# Specification of how this service routes traffic
spec:
  # Type NodePort exposes the service on each Kubernetes Node's IP at a static port
  type: NodePort
  # Tells the service to route incoming traffic to Pods that have the label 'app: simple-app'
  selector:
    app: simple-app
  # Port mapping definitions
  ports:
    # The port exposed on the cluster internally (Service Port)
    - port: 80
      # The target port inside the containers/pods to route traffic to (Flask port 5000)
      targetPort: 5000
      # The static port on the host machine/minikube IP that maps directly to this service (range 30000-32767)
      nodePort: 30080
