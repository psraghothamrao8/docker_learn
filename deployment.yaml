# =========================================================================
# PART 1: KUBERNETES DEPLOYMENT CONFIGURATION
# =========================================================================
# A Deployment specifies how many copies (replicas) of your app container 
# should run, how to update them, and what environment variables to inject.

# Define the Kubernetes API version used for Deployments
apiVersion: apps/v1

# Specify that this resource is a Deployment (responsible for managing replica Pods)
kind: Deployment

# Metadata configuration for this deployment
metadata:
  # The name of our deployment resource inside Kubernetes (used for command lookups)
  name: simple-app-deployment
  # Key-value labels used to group, filter, and identify this resource
  labels:
    app: simple-app

# Specification of the desired state of the deployment
spec:
  # The number of identical container instances (Pods) we want running simultaneously
  replicas: 2
  
  # Define how the deployment finds and manages the pods (it selects pods matching these labels)
  selector:
    matchLabels:
      app: simple-app
      
  # Template used by Kubernetes to create the Pods (containers)
  template:
    # Metadata for the Pods generated by this template
    metadata:
      # Labels assigned to the generated Pods (must match the selector above so the deployment can track them)
      labels:
        app: simple-app
        
    # Specification of the actual containers running inside the Pods
    spec:
      containers:
      # A list of containers to run in the Pod (here we only have one container running simple-app)
      - name: simple-app
        # The container image to run (the tag 'latest' refers to our local build)
        image: simple-app:latest
        
        # Instruct Kubernetes not to download the image from a remote registry (like Docker Hub)
        # because the image exists only in our local/Minikube docker cache.
        imagePullPolicy: Never
        
        # The port inside the container that our web app listens on (Flask default is 5000)
        ports:
        - containerPort: 5000
        
        # Environment variables injected into the running container
        env:
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              # The name of the Kubernetes secret resource (vault) containing the credentials
              name: app-secret    
              # The specific key within that secret resource to load
              key: secret-key     

# --- is the YAML document separator. It tells Kubernetes that a new resource configuration begins here.
---

# =========================================================================
# PART 2: KUBERNETES SERVICE CONFIGURATION
# =========================================================================
# A Service acts as a load-balancer. It gives you a single permanent IP or port 
# to access your pods, even if pods crash and get recreated with new IPs.

# Define the Kubernetes API version used for Services
apiVersion: v1

# Specify that this resource is a Service (responsible for routing traffic to Pods)
kind: Service

# Metadata configuration for this service
metadata:
  # The name of our service resource in Kubernetes (used to generate access links)
  name: simple-app-service

# Specification of how this service routes traffic
spec:
  # NodePort type exposes the service outside the cluster on a static port on each machine node.
  # This makes the app accessible in our local computer's browser using Minikube.
  type: NodePort
  
  # Tells the service to route incoming traffic to Pods that have the label 'app: simple-app'
  selector:
    app: simple-app
    
  # Port mapping definitions
  ports:
    # The port exposed on the cluster internally (Service Port)
    - port: 80
      # The target port inside the containers/pods to route traffic to (Flask port 5000)
      targetPort: 5000
      # The static port on the host machine/minikube IP that maps directly to this service.
      # The allowable range in Kubernetes is 30000-32767. We hardcoded 30080.
      nodePort: 30080
